# Deux thèmes : l'application suit le réglage clair ou sombre de Windows (la fenêtre G.A.R.P est toujours en
# sombre). Accent : l'ocre de la marque (docs/MARQUE.md), choisi pour son contraste avec le fond et avec le texte
# blanc des boutons ; liens dans l'ocre de la marque en sombre, l'ocre foncé en clair.
[theme]
# Titres en Manrope (licence OFL, static/polices), embarquée : rien à télécharger à l'usage.
headingFont = "Manrope, Source Sans Pro, sans-serif"
headingFontWeights = 700

[[theme.fontFaces]]
family = "Manrope"
url = "app/static/polices/Manrope.ttf"
weight = "200 800"

[theme.light]
primaryColor = "#8a5a12"
linkColor = "#8a5a12"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f3f2ee"
textColor = "#0b0b0b"
borderColor = "#d8d7d0"
baseRadius = "0.6rem"

[theme.dark]
primaryColor = "#a86c1a"
linkColor = "#c98b2e"
backgroundColor = "#1a1a19"
secondaryBackgroundColor = "#242422"
textColor = "#f0efec"
borderColor = "#3a3a37"
baseRadius = "0.6rem"

[client]
# Ni bouton « Deploy » ni outils de développement : l'application ne sert qu'à vous.
toolbarMode = "viewer"

[server]
# Interface réservée à cet ordinateur : sans cette ligne, tout le réseau local (Wi-Fi public compris)
# pourrait voir le portefeuille et modifier le journal.
address = "localhost"
headless = true
runOnSave = false
# Police des titres servie depuis static/ (seulement à cet ordinateur, comme le reste).
enableStaticServing = true

[browser]
gatherUsageStats = false
