name: Installateur Windows

# Construit et publie l'installateur Windows de G.A.R.P, qui installe l'outil du PC lui-même (Streamlit, avec son
# Python : installateur/preparer_outil.ps1). Sur main, chaque construction devient une release « app-b<numéro> »,
# que G.A.R.P propose d'installer. Sobriété : construit sur main seulement, ou à la demande pour essayer une branche
# avant fusion (gh workflow run app.yml --ref <branche>).
on:
  push:
    branches: [main]
    paths:
      - installateur/**
      - portefeuille/pf/**
      - portefeuille/vues/**
      - portefeuille/app.py
      - portefeuille/GARP.pyw
      - portefeuille/requirements.txt
      - portefeuille/.streamlit/**
      - portefeuille/static/**
      - portefeuille/docs/METHODE.md
      - portefeuille/config/**
      - portefeuille/assets/garp.*
      - portefeuille/assets/entete.png
      - .github/workflows/app.yml
      - .github/notes_release_app.md
  workflow_dispatch:

# Numéro de version = numéro du passage + 40 : le dépôt public a repris à 1 le 22/11/2026, après la b37 du dépôt
# d'origine ; les versions installées ne proposent qu'un numéro plus grand que le leur.
permissions:
  contents: write

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Numéro de version
        shell: pwsh
        run: |
          "NUMERO=$(${{ github.run_number }} + 40)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Outil du PC et son Python
        shell: pwsh
        run: installateur\preparer_outil.ps1 -Sortie build\garp-pc -Numero ${{ env.NUMERO }}
      - name: Installateur (Inno Setup)
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress | Out-Null
            $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" | Select-Object -First 1
          }
          & $iscc.FullName /Q "/DNumero=${{ env.NUMERO }}" "/DSource=$PWD\build\garp-pc" installateur\garp.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item installateur\sortie\GARP-Setup-b${{ env.NUMERO }}.exe .
          Write-Host ("Installateur : {0:N0} Mo" -f ((Get-Item GARP-Setup-b${{ env.NUMERO }}.exe).Length / 1MB))
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: GARP-Setup-b${{ env.NUMERO }}.exe
          compression-level: 0

  publier:
    if: github.ref == 'refs/heads/main'
    needs: windows
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Numéro de version
        run: echo "NUMERO=$(( ${{ github.run_number }} + 40 ))" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: sorties
          merge-multiple: true
      - name: Release app-b${{ env.NUMERO }}
        run: |
          sed "s/NUMERO/${{ env.NUMERO }}/g" .github/notes_release_app.md > notes.md
          gh release create app-b${{ env.NUMERO }} sorties/* \
            --title "G.A.R.P version ${{ env.NUMERO }}" \
            --notes-file notes.md --latest
